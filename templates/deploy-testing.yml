name: deploy-testing
on:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  qa:
    uses: agusnarvaez/bapps-workflows/.github/workflows/qa.yml@v1
  security:
    uses: agusnarvaez/bapps-workflows/.github/workflows/security.yml@v1
  deploy:
    needs: qa
    uses: agusnarvaez/bapps-workflows/.github/workflows/deploy-vps.yml@v1
    with: { app: ID, env: testing, health-url: 'URL_TESTING/version.json', build-dir: BUILD_DIR }
    secrets: inherit
