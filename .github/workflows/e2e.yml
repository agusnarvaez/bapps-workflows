name: e2e
on:
  workflow_call:
    inputs:
      base-url: { type: string, required: true }
      working-directory: { type: string, default: '.' }
      # Comando antes de Playwright (ej. bapps-console crea su usuario de prueba en testing). Tiene SSH_KEY en el env.
      setup-script: { type: string, default: '' }
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ${{ vars.BAPPS_RUNNER || 'ubuntu-latest' }}   # runner propio si el repo tiene BAPPS_RUNNER (bapps-console docs/setup/runner.md)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node antes que pnpm: ver el comentario en qa.yml (pnpm/action-setup#251, runner propio).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - if: hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: '${{ inputs.working-directory }}/package.json' }
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi
          npx playwright install --with-deps chromium
      # Testing en la tailnet (bapps-console: URL *.ts.net y SSH al VPS por su IP de Tailscale). El runner propio ya está
      # en la tailnet; en GitHub (zenbook apagada, bapps-console docs/setup/runner.md) entra como en deploy-vps.yml.
      # Los secretos llegan con `secrets: inherit`. Un sitio público no entra a la tailnet ni necesita los secretos.
      - if: vars.BAPPS_RUNNER == '' && contains(inputs.base-url, '.ts.net')
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
        env: { SSH_KEY: '${{ secrets.SSH_KEY }}' }
      - id: pw
        run: npx playwright test --project=chromium
        env: { BASE_URL: '${{ inputs.base-url }}' }
      # Capturas y errores de consola para la verificación con IA del panel (bapps-console, Fase 4). En el runner propio
      # de un piloto, /e2e-out es una carpeta de la zenbook (una por repo, bapps-console infra/runner/runners.sh) que lee
      # el runner de IA de la misma máquina. Sin carpeta (ubuntu-latest u otro repo) no se guarda nada: los artifacts de
      # GitHub no se usan porque la cuota de almacenamiento se llenó (2026-11-22).
      - if: always() && hashFiles(format('{0}/test-results/**', inputs.working-directory)) != ''
        env: { RESULTADO: '${{ steps.pw.outcome }}', RUN: '${{ github.run_id }}', SHA: '${{ github.sha }}' }
        run: |
          [ -d /e2e-out ] && [ -w /e2e-out ] || { echo "sin /e2e-out: no se guardan capturas"; exit 0; }
          dest="/e2e-out/$RUN"
          rm -rf "$dest.tmp" && cp -r test-results "$dest.tmp"
          printf '{"runId":%s,"sha":"%s","resultado":"%s","at":"%s"}\n' "$RUN" "$SHA" "$RESULTADO" "$(date -u +%FT%TZ)" > "$dest.tmp/meta.json"
          rm -rf "$dest" && mv "$dest.tmp" "$dest"
          # ponytail: retención por antigüedad; el runner de IA borra lo que ya juzgó.
          find /e2e-out -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
