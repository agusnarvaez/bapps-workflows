name: e2e
on:
  workflow_call:
    inputs:
      base-url: { type: string, required: true }
      working-directory: { type: string, default: '.' }
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ${{ vars.BAPPS_RUNNER || 'ubuntu-latest' }}   # runner propio si el repo tiene BAPPS_RUNNER (bapps-console docs/setup/runner.md)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: '${{ inputs.working-directory }}/package.json' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
        env: { BASE_URL: '${{ inputs.base-url }}' }
