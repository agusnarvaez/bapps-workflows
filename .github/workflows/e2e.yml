name: e2e
on:
  workflow_call:
    inputs:
      base-url: { type: string, required: true }
      working-directory: { type: string, default: '.' }
      # Comando antes de Playwright (ej. bapps-console crea su usuario de prueba en testing). Tiene SSH_KEY en el env.
      setup-script: { type: string, default: '' }
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ${{ vars.BAPPS_RUNNER || 'ubuntu-latest' }}   # runner propio si el repo tiene BAPPS_RUNNER (bapps-console docs/setup/runner.md)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node antes que pnpm: ver el comentario en qa.yml (pnpm/action-setup#251, runner propio).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - if: hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: '${{ inputs.working-directory }}/package.json' }
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi
          npx playwright install --with-deps chromium
      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
        env: { SSH_KEY: '${{ secrets.SSH_KEY }}' }
      - run: npx playwright test --project=chromium
        env: { BASE_URL: '${{ inputs.base-url }}' }
      # Capturas y errores de consola para la verificación con IA del panel (bapps-console, Fase 4): el worker baja este
      # artifact por el run. 7 días alcanzan: el runner lo baja en la noche siguiente.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.sha }}
          path: ${{ inputs.working-directory }}/test-results/
          retention-days: 7
          if-no-files-found: ignore
